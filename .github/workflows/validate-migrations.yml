name: Validate Migrations

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Validate migrations
      run: |
        echo "🔍 Validating migrations..."
        echo "🧪 Starting local Supabase to test migrations"
        npx supabase start
        echo "✅ All migrations validated successfully!" 