name: Deploy to Production

on:
  push:
    branches: [ master ]  # Deploy when dev is merged to master
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Link to production project
      run: |
        echo "🔗 Linking to production project..."
        npx supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }} --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying migrations to production..."
        echo "⚠️  This will update the production database schema"
        npx supabase db push --yes --password ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

    - name: Verify deployment
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🔗 Check your production database: https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROD_PROJECT_REF }}"

    - name: Upload backup artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-backup-${{ github.sha }}
        path: backups/
        retention-days: 30 